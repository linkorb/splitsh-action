name: Build and Publish Docker Image

on:
  push:
    tags:
     - '*'
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: linkorb/splitsh-action

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # v4.3 https://github.com/docker/setup-buildx-action/commit/37fe631027851001ddb9b187196cc803df7f5f0e
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          platforms: linux/amd64

      - name: Log in to the Container registry
        # v4.6 https://github.com/docker/login-action/commit/dbcb813823bdd20940b903addbd779551569679f
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        # v6.2 https://github.com/docker/metadata-action/commit/dc802804100637a589fabce1cb79ff13a1411302
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        # 7.3 https://github.com/docker/build-push-action/commit/53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
